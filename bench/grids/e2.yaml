# E2: external check. SGLang ships the fcfs/lpm pair, so its direction of effect is an
# independent test of Mercury's. Install vLLM and SGLang in separate environments or
# separate sessions; they pin conflicting torch and kernel versions.
name: e2
model: Qwen/Qwen2.5-0.5B-Instruct
revision: null
out_dir: results/e2
traces_dir: traces
block_size: 16
max_running: 64
max_model_len: 8192
num_requests: 500
warmup_requests: 50
startup_timeout: 1800
cooldown_s: 15
shuffle_seed: 1

r_sat: 12.0
rate_factors: [0.8]
seeds: [0, 1, 2]

workload_params:
  w2:
    groups: 16
  w4:
    tasks: 8

points:
  - engine: sglang
    policies: [fcfs, lpm]
    workloads: [w1, w2, w4]
    rhos: [1, 2]

  - engine: vllm
    policies: [fcfs]
    workloads: [w1, w2, w4]
    rhos: [1, 2]
